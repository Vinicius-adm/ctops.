version: '3'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ctops-postgres
    environment:
      POSTGRES_USER: ctops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ctops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctops -d ctops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ctops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend  # Caminho para o Dockerfile do seu backend
    container_name: ctops-backend
    ports:
      - "3001:3000"  # ou qualquer porta que o backend use
    environment:
      DATABASE_URL: postgres://ctops:password@ctops-postgres:5432/ctops_db  # String de conexão com o PostgreSQL
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
